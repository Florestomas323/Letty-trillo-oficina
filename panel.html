<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<script src="config.js"></script>
<title>Panel del Distribuidor — Letty Trillo</title>
<link rel="manifest" href="panel.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mi panel">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=2">
<link rel="icon" type="image/png" href="favicon-oficina.png?v=2">


<meta name="apple-mobile-web-app-title" content="Mi Oficina">
<meta name="theme-color" content="#0B0B0B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#0B0B0B;--card:#161616;--ink:#FAF8F3;--stone:#C2B7A3;--hair:rgba(212,175,55,.15);
    --gold:#E3C15A;--gold-text:#F2DC8E;--royal:#EBD08A;--ok:#5DE08A;--danger:#FF8A8A;--warn:#E8C766;
    --sh:0 1px 2px rgba(0,0,0,.45),0 8px 24px rgba(0,0,0,.40);
    --shl:0 2px 6px rgba(0,0,0,.5),0 18px 44px rgba(140,110,31,.32);
    --radius:18px;--ease:cubic-bezier(.22,.8,.24,1);
    --metal:linear-gradient(135deg,#E8C65A 0%,#D4AF37 52%,#8C6E1F 100%);
    --metal-silver:linear-gradient(135deg,#F7F5F1 0%,#DAD2C6 45%,#A69B8B 100%);
    --silver:#E8E1D5; --silver-dim:#A69C88;
    --ink:#FAF8F3; --card:#161616; --stone:#C2B7A3;
    --gold:#E3C15A; --gold-text:#F2DC8E; --hairline:rgba(212,175,55,.15);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{background:var(--paper);color:var(--ink);font-family:'Inter',system-ui,sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  input,textarea,select{font:inherit;color:inherit;width:100%;background:var(--card);border:1px solid var(--hair);border-radius:12px;padding:12px 14px}
  input:focus,textarea:focus,select:focus{outline:2px solid var(--gold);outline-offset:1px;border-color:transparent}
  h1,h2,h3{font-family:'Inter Tight',sans-serif;letter-spacing:-.02em;line-height:1.15}
  a{color:inherit}
  a:focus-visible,button:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:8px}

  .center{min-height:100svh;display:flex;align-items:center;justify-content:center;padding:20px}
  .verifying{display:flex;flex-direction:column;align-items:center;gap:16px;color:var(--stone);font-size:14px}
  .ring{width:34px;height:34px;border-radius:50%;border:3px solid var(--hair);border-top-color:var(--gold);animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media(prefers-reduced-motion:reduce){.ring{animation:none}}

  .card{background:var(--card);border:1px solid var(--hair);border-radius:22px;padding:38px 30px;max-width:400px;width:100%;box-shadow:var(--shl);text-align:center;position:relative;overflow:hidden}
  .card::after{content:"";position:absolute;top:0;left:30px;right:30px;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.6}
  .icon-3d{position:relative;display:grid;place-items:center;margin:0 auto;width:62px;height:62px;border-radius:20px;color:#EAE4D8;background:radial-gradient(circle at 30% 20%, rgba(20,17,9,.96), rgba(255,255,255,.35) 42%, transparent 72%),linear-gradient(145deg,var(--card),#EAE5DB);border:1px solid rgba(255,255,255,.9);box-shadow:inset 2px 2px 5px rgba(255,255,255,.95),inset -3px -3px 8px rgba(0,0,0,.07),0 10px 20px rgba(0,0,0,.10)}
  .icon-3d svg{width:29px;height:29px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.14))}
  h1{font-size:23px;margin-top:14px}
  .sub{color:var(--stone);font-size:13.5px;margin-top:6px}
  .g-btn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;margin-top:26px;padding:15px 20px;border-radius:14px;border:1px solid var(--hair);background:var(--card);font-weight:600;font-size:15px;box-shadow:var(--sh);transition:transform .25s var(--ease), box-shadow .25s;min-height:52px}
  .g-btn:active{transform:scale(.98)}
  .g-btn:disabled{opacity:.6;pointer-events:none}
  .msg{margin-top:16px;font-size:13.5px;border-radius:12px;padding:12px 14px;display:none;text-align:left}
  .msg.show{display:block}
  .msg.err{background:rgba(255,138,138,.12);color:var(--danger);border:1px solid rgba(255,138,138,.30)}
  .msg.info{background:rgba(93,224,138,.10);color:var(--ok);border:1px solid rgba(93,224,138,.30)}

  /* App */
  #app{display:none}
  header.bar{position:sticky;top:0;z-index:40;background:rgba(20,17,9,.9);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--hair)}
  .bar-in{max-width:820px;margin:0 auto;padding:14px 16px;display:flex;align-items:center;gap:12px}
  .bar-in .who{font-size:11px;color:var(--gold-text);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
  .bar-in h2{font-size:16px}
  .avatar{width:34px;height:34px;border-radius:50%;object-fit:cover;border:1px solid var(--hair)}
  .logout{margin-left:auto;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--hair);background:var(--card);border-radius:999px;padding:9px 14px;font-weight:600;font-size:13px;box-shadow:var(--sh);min-height:40px}
  .logout:active{transform:scale(.97)}
  .cloud{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--stone);padding:6px 12px;border-radius:999px;background:var(--card);border:1px solid var(--hair)}
  .cloud .dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
  .cloud.saving .dot{background:var(--warn)}

  .wrap{max-width:820px;margin:0 auto;padding:20px 16px 80px}
  .tabs{display:flex;gap:8px;overflow-x:auto;padding:14px 16px;position:sticky;top:62px;z-index:30;background:rgba(20,17,9,.92);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;padding:9px 16px;border-radius:999px;border:1px solid var(--hair);background:var(--card);font-weight:600;font-size:13.5px;color:var(--stone)}
  .tab.on{background:var(--metal);color:#fff;border-color:var(--ink)}
  .panel{display:none}
  .panel.on{display:block;animation:fade .4s var(--ease)}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  .item{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--hair);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:var(--sh)}
  .item .thumb{width:56px;height:56px;border-radius:12px;object-fit:cover;flex:0 0 auto;background:#332D1B;display:grid;place-items:center;overflow:hidden}
  .item .ti{flex:1;min-width:0}
  .item .ti b{font-family:'Inter Tight';font-size:15.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .ti .sub{font-size:12.5px;color:var(--stone);display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
  .st{font-size:11px;padding:2px 8px;border-radius:999px;font-weight:600}
  .st-pub{background:rgba(93,224,138,.13);color:#5DE08A}
  .st-hid{background:rgba(255,138,138,.12);color:#9C3524}
  .acts{display:flex;gap:6px;flex:0 0 auto}
  .icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--hair);background:var(--card);display:grid;place-items:center;font-size:15px}
  .icon-btn:active{transform:scale(.94)}

  .card-form{background:var(--card);border:1px solid var(--hair);border-radius:18px;padding:20px;margin-bottom:16px;box-shadow:var(--sh)}
  label{display:block;font-size:12.5px;font-weight:600;color:var(--stone);margin:14px 0 6px}
  label:first-child{margin-top:0}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:13px 22px;font-weight:600;font-size:14.5px;min-height:46px;transition:transform .2s}
  .btn:active{transform:scale(.97)}
  .btn-solid{background:var(--metal);color:#fff}
  .btn-line{background:var(--card);border:1px solid var(--hair)}
  .btn-block{width:100%}
  .form-acts{display:flex;gap:10px;margin-top:18px}
  .hint{font-size:12px;color:#767168;margin-top:8px}
  .dash-hi h2{font-size:22px}
  .dash-hi p{color:var(--stone);font-size:14px;margin-top:4px}
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}
  .stat-card{background:var(--card);border:1px solid var(--hair);border-radius:16px;padding:16px;box-shadow:var(--sh);text-align:left;width:100%;display:block;transition:transform .2s var(--ease),box-shadow .2s}
  .stat-card:active{transform:scale(.97)}
  @media(hover:hover){.stat-card:hover{box-shadow:var(--shl);transform:translateY(-2px)}}
  .stat-card .go{display:inline-block;margin-top:10px;font-size:12px;font-weight:600;color:var(--gold-text)}
  .stat-card .sn{font-family:'Inter Tight';font-size:28px;font-weight:700}
  .stat-card .sl{font-size:12.5px;color:var(--stone);margin-top:2px}
  .toast{pointer-events:none;position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--metal);color:#fff;padding:13px 22px;border-radius:999px;font-size:14px;font-weight:500;opacity:0;transition:all .3s var(--ease);z-index:100;box-shadow:var(--shl)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .drag-handle{width:34px;height:44px;flex:0 0 auto;display:grid;place-items:center;font-size:20px;color:#A69C88;cursor:grab;touch-action:none;letter-spacing:-2px}
  .drag-handle:active{cursor:grabbing;color:var(--gold)}
  .gal-row{transition:box-shadow .2s}
  .gal-row.dragging{box-shadow:var(--shl);opacity:.96}
  .gal-placeholder{border:2px dashed var(--gold);border-radius:16px;margin-bottom:12px;background:rgba(232,199,102,.12)}
  .empty-note{text-align:center;color:var(--stone);font-size:14px;padding:30px 20px;background:var(--card);border:1px dashed var(--hair);border-radius:16px}

  .maint-card{margin-top:18px;padding:16px;border:1px dashed var(--line,rgba(212,175,55,.15));border-radius:14px;background:rgba(255,255,255,.04)}
  .maint-t{font-weight:700;font-size:14px;margin-bottom:4px}
  .maint-p{font-size:13px;color:#C2B7A3;line-height:1.5;margin-bottom:12px}

  /* ---------- Analítica ---------- */
  .ana-filter{display:flex;gap:8px;margin:16px 0 18px}
  .ana-chip{flex:1;padding:9px 0;border:1px solid var(--line,rgba(212,175,55,.15));background:var(--card);border-radius:10px;font-size:13px;font-weight:600;color:#C2B7A3;cursor:pointer}
  .ana-chip.on{background:var(--metal);color:#fff;border-color:rgba(212,175,55,.35)}
  .ana-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:8px}
  .ana-card{background:var(--card,var(--card));border:1px solid var(--hairline,rgba(212,175,55,.15));border-radius:14px;padding:16px 8px;text-align:center}
  .ana-card .ana-n{font-family:'Inter Tight',sans-serif;font-weight:700;font-size:26px;letter-spacing:-.02em;color:var(--ink)}
  .ana-card .ana-l{font-size:11.5px;color:#C2B7A3;margin-top:2px}
  .ana-h{font-size:14px;font-weight:700;margin:24px 0 12px}
  .ana-bar{margin-bottom:12px}
  .ana-bar-top{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:5px}
  .ana-bar-top b{font-weight:700}
  .ana-track{height:9px;background:#332D1B;border-radius:6px;overflow:hidden}
  .ana-fill{height:100%;background:linear-gradient(90deg,#B8860B,#8A672B);border-radius:6px;transition:width .4s ease}
  .ana-ref{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--hairline,rgba(212,175,55,.15));font-size:14px}
  .ana-ref b{font-weight:700}
  .stat-wide{grid-column:1 / -1;display:flex;align-items:center;justify-content:space-between;text-align:left}

  .conv-box{background:var(--card,var(--card));border:1px solid var(--hairline,rgba(212,175,55,.15));border-radius:16px;padding:6px 16px;margin-top:10px}
  .conv-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--hairline,rgba(212,175,55,.15))}
  .conv-row:last-child{border-bottom:0}
  .conv-row b{font-family:'Inter Tight',sans-serif;font-size:24px;display:block;letter-spacing:-.02em}
  .conv-row span{font-size:12.5px;color:#C2B7A3}
  .conv-d{font-size:12.5px;color:#C2B7A3;text-align:right;max-width:48%;line-height:1.45}
  .ana-ref i{font-style:normal;color:#A69C88;font-weight:500;font-size:12.5px}
  .ana-tip{font-size:12.5px;color:#C2B7A3;line-height:1.55;background:rgba(255,255,255,.04);border:1px dashed rgba(212,175,55,.15);border-radius:12px;padding:12px 14px;margin-top:20px}

  /* ---- Paleta morada: capa de fondo compartida con el sitio ---- */
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
  body{position:relative;background:#0B0B0B;color:var(--ink)}
  body::before{
    content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;
    background:#0B0B0B url('fondo-textura.jpeg') center center / cover no-repeat;opacity:.55;
  }
  body::after{
    content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:
      radial-gradient(120% 80% at 50% 0%, rgba(212,175,55,.20), transparent 60%),
      linear-gradient(180deg, rgba(18,15,8,.62) 0%, rgba(18,15,8,.86) 55%, rgba(18,15,8,.94) 100%);
  }
  ::selection{background:rgba(250,218,139,.32);color:#fff}
  /* El logotipo "Regala y Gana" tiene tipografia azul marino: se perfila en claro */
  img[alt="Regala y Gana"], .logo, .ryg-logo, #brandLogo{
    filter:drop-shadow(0 0 1.6px rgba(255,255,255,.95)) drop-shadow(0 2px 12px rgba(255,255,255,.28));
  }
  @media print{
    body{background:#FFFFFF!important;color:#111110!important}
    body::before,body::after{display:none!important}
    *{color:#111110!important;background:transparent!important;box-shadow:none!important;
      border-color:#D6D2CF!important;-webkit-text-fill-color:#111110!important;filter:none!important}
  }

  /* ---- Prospectos y avisos de novedades ---- */
  .tab{ position:relative; }
  .tab-badge{
    display:inline-flex; align-items:center; justify-content:center;
    min-width:19px; height:19px; padding:0 5px; margin-left:7px;
    border-radius:999px; font-size:11.5px; font-weight:700; line-height:1;
    background:#D4AF37; color:#fff; vertical-align:middle; }
  #avisosCaja{ margin-bottom:16px; padding:14px 16px; border-radius:16px;
    background:rgba(212,175,55,.12); border:1px solid rgba(212,175,55,.28); }
  .aviso-tit{ font-size:12.5px; font-weight:700; letter-spacing:.06em;
    text-transform:uppercase; color:#F2DC8E; margin-bottom:9px; }
  .aviso-row{ display:flex; flex-wrap:wrap; gap:8px; }
  .aviso-item{ font:inherit; font-size:14px; cursor:pointer;
    padding:8px 14px; min-height:40px; border-radius:999px;
    background:rgba(255,255,255,.06); border:1px solid rgba(212,175,55,.25);
    color:#FAF8F3; }
  .aviso-item b{ color:#F2DC8E; }
  .pr-card{ padding:15px 16px; border-radius:16px; margin-bottom:11px;
    background:rgba(255,255,255,.04); border:1px solid rgba(212,175,55,.16); }
  .pr-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; flex-wrap:wrap; }
  .pr-top b{ font-size:15.5px; }
  .pr-est{ display:inline-block; margin-left:9px; padding:2px 9px; border-radius:999px;
    font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; }
  .pr-nueva{ background:rgba(212,175,55,.24); color:#FFF2C6; }
  .pr-contactado{ background:rgba(93,224,138,.18); color:#8FEAB0; }
  .pr-descartado{ background:rgba(255,138,138,.16); color:#FFB3B3; }
  .pr-fecha{ font-size:12.5px; color:#A69C88; white-space:nowrap; }
  .pr-datos{ display:flex; gap:14px; flex-wrap:wrap; margin-top:7px; font-size:13.5px; color:#C2B7A3; }
  .pr-chips{ display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }
  .pr-chip{ font-size:12px; padding:4px 10px; border-radius:999px;
    background:rgba(212,175,55,.12); border:1px solid rgba(212,175,55,.2); color:#DCD1B7; }
  .pr-acc{ display:flex; gap:7px; flex-wrap:wrap; margin-top:13px; }
  .ryg-b.danger{ border-color:rgba(255,138,138,.35); color:#FFB3B3; }


  /* ---- Barra de notificaciones ---- */
  #pushBar{ margin-bottom:16px; padding:14px 16px; border-radius:16px;
    background:rgba(255,255,255,.045); border:1px solid rgba(212,175,55,.2);
    display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  #pushBar.ok{ background:rgba(93,224,138,.10); border-color:rgba(93,224,138,.28); }
  #pushBar.aviso{ background:rgba(232,199,102,.10); border-color:rgba(232,199,102,.30); }
  .pb-txt{ flex:1 1 220px; font-size:13.5px; line-height:1.5; color:#DCD1B7; }
  .pb-txt b{ color:#FAF8F3; display:block; margin-bottom:3px; font-size:14.5px; }
  .pb-acc{ display:flex; gap:8px; flex-wrap:wrap; }
  .pb-b{ font:inherit; font-size:14px; font-weight:600; cursor:pointer;
    min-height:42px; padding:0 18px; border-radius:999px;
    background:linear-gradient(135deg,#E8C65A,#D4AF37 52%,#8C6E1F);
    border:1px solid rgba(255,238,178,.34); color:#fff; }
  .pb-b.ghost{ background:rgba(255,255,255,.06); border-color:rgba(212,175,55,.28); color:#FAF8F3; }
  .pb-b:disabled{ opacity:.55; cursor:default; }

</style>
</head>
<body>

<div class="center" id="loadingView">
  <div class="verifying"><div class="ring" role="status" aria-label="Verificando sesión"></div><span id="loadingTxt">Verificando sesión…</span><span style="display:block;font-size:10px;color:#A69C88;margin-top:8px">v3-corregido</span></div>
</div>

<div class="center" id="loginView" style="display:none">
  <div class="card">
    <span class="icon-3d" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></svg></span>
    <h1>Panel del Distribuidor</h1>
    <p class="sub">Letty Trillo · Royal Prestige</p>
    <button class="g-btn" id="googleBtn" type="button">
      <svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3c-1.6 4.7-6.1 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3l5.7-5.7C34.5 6.1 29.5 4 24 4 13 4 4 13 4 24s9 20 20 20 20-9 20-20c0-1.3-.1-2.6-.4-3.9z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.9 1.2 8 3l5.7-5.7C34.5 6.1 29.5 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.4 0 10.3-2.1 14-5.4l-6.5-5.5c-2.1 1.6-4.7 2.9-7.5 2.9-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4 5.6l6.5 5.5C41.6 35.6 44 30.3 44 24c0-1.3-.1-2.6-.4-3.9z"/></svg>
      Entrar con Google
    </button>
    <div class="msg" id="loginMsg" role="alert" aria-live="polite"></div>
    <p class="sub" style="margin-top:18px">Acceso exclusivo del administrador.</p>
  </div>
</div>

<div id="app">
  <header class="bar">
    <div class="bar-in">

  // --- Foto sin Storage: comprime a un base64 pequeño para guardar en Firestore (<1MB) ---
  async function subirFoto(file, carpeta){
    const dataUrl = await new Promise((res,rej)=>{
      const fr = new FileReader(); fr.onload=()=>res(fr.result); fr.onerror=rej; fr.readAsDataURL(file);
    });
    const img = await new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=rej; im.src=dataUrl; });
    // tamaño moderado (máx 900px) y calidad 0.72 para que pese poco
    const max = 900;
    let w = img.width, hh = img.height;
    if(w > max){ hh = Math.round(hh * max / w); w = max; }
    const canvas = document.createElement("canvas"); canvas.width=w; canvas.height=hh;
    canvas.getContext("2d").drawImage(img,0,0,w,hh);
    let q = 0.72;
    let out = canvas.toDataURL("image/jpeg", q);
    // si sigue pesando mucho, bajar calidad hasta caber bajo ~700KB
    while(out.length > 700000 && q > 0.4){ q -= 0.1; out = canvas.toDataURL("image/jpeg", q); }
    return out;
  }

lera Royal Prestige", "cats": ["tamalera", "tamales"], "badge": "Favorita de nuestros clientes", "desc": "Tamales tradicionales cocinados al vapor con una textura perfecta.", "img": "", "tone": "#4A3B26", "video": "", "ingredients": [{"name": "Masa para tamales", "amount": "1 kg"}, {"name": "Carne de cerdo o pollo cocida y deshebrada", "amount": "500 g"}, {"name": "Chile guajillo o de tu preferencia", "amount": "4 piezas"}, {"name": "Hojas de maíz", "amount": "16"}, {"name": "Caldo de la cocción", "amount": "1 taza y media"}, {"name": "Sal", "amount": "al gusto"}], "steps": ["Remoja las hojas de maíz en agua caliente durante 20 minutos hasta que estén flexibles. Escúrrelas bien.", "Hidrata los chiles en agua caliente, licúalos con un poco de caldo y sal, y mezcla esta salsa con la carne deshebrada.", "Bate la masa incorporando el caldo poco a poco hasta que esté suave y esponjosa. <b>Prueba de la bolita:</b> si una porción de masa flota en un vaso de agua, está lista.", "Extiende 2 cucharadas de masa sobre cada hoja, agrega una porción de carne al centro y dobla los costados y la base hacia arriba.", "Coloca agua en la base de la tamalera, acomoda los tamales en vertical con la abertura hacia arriba y cocina al vapor a fuego medio durante <b>1 hora</b>.", "Están listos cuando la masa se despega limpiamente de la hoja. Déjalos reposar 10 minutos antes de servir."], "tip": "No amontones los tamales: el vapor debe circular entre ellos para una cocción pareja de principio a fin.", "royalTip": "Con tu Tamalera Royal Prestige no necesitas fuego alto: la tapa conserva el vapor y mantiene la temperatura estable. Cocinas los mismos tamales gastando menos gas."}, {"id": "pollo-romero", "name": "Pollo al Romero con Papas", "time": "45 min", "servings": "4 porciones", "diff": "Fácil", "utensil": "Olla Royal Prestige", "cats": ["ollas", "carnes", "pollo", "saludable"], "badge": "Recomendada", "desc": "Una comida completa, saludable y llena de sabor.", "img": "", "tone": "#5A4630 s antes</b> de cocinar. Sécalo muy bien con papel y sazona generosamente con sal gruesa y pimienta.", "Calienta el sartén a fuego medio-alto, en seco, hasta que una gota de agua baile sobre la superficie. Esa es la señal de que está listo.", "Coloca el ribeye y <b>no lo muevas durante 3 minutos</b>. Voltéalo una sola vez y cocina 3 minutos más para término medio.", "Baja el fuego, agrega la mantequilla, el ajo y el romero. Inclina el sartén y baña la carne con la mantequilla espumosa durante 1 minuto por lado.", "Retira el ribeye a una tabla y <b>déjalo reposar 5 minutos</b> antes de cortar, para que los jugos se redistribuyan."], "tip": "La sal gruesa antes de cocinar y el reposo después de cocinar: esos dos hábitos separan un buen corte de uno perfecto.", "royalTip": "El acero de tu Sartén Royal Prestige distribuye el calor de manera uniforme y lo retiene: no necesitas fuego máximo ni exceso de aceite para lograr una costra dorada perfecta."}, {"id": "pasta-alfredo", "name": "Pasta Alfredo con Pollo", "time": "25 min", "servings": "4 porciones", "diff": "Fácil", "utensil": "Olla Royal Prestige", "cats": ["ollas", "pastas", "pollo"], "badge": "Lista en menos de 30 minutos", "desc": "Una receta cremosa ideal para compartir en familia.", "img": "", "tone": "#5C5138", "video": "", "ingredients": [{"name": "Pasta fettuccine", "amount": "400 g"}, {"name": "Pechuga de pollo en tiras", "amount": "2"}, {"name": "Crema para batir", "amount": "1 taza y media"}, {"name": "Queso parmesano rallado", "amount": "1 taza"}, {"name": "Mantequilla", "amount": "40 g"}, {"name": "Dientes de ajo", "amount": "2"}, {"name": "Sal y pimienta", "amount": "al gusto"}], "steps": ["Cocina la pasta en agua con sal siguiendo el tiempo del paquete. Antes de escurrir, <b>reserva 1 taza del agua de cocción</b>.", "Mientras, sazona el pollo con sal y pimienta y dóralo en la olla con la mitad de la mantequilla, unos 6 minutos. Retíralo.", "En la misma olla, derrite el resto de la mantequilla y sofríe el ajo picado 30 segundos, sin que dore.", "Vierte la crema, baja el fuego y agrega el parmesano en dos tandas, moviendo hasta que la salsa esté sedosa.", "Regresa el pollo, incorpora la pasta y mezcla. Si la salsa espesa de más, suéltala con un poco del agua reservada. Sirve con parmesano extra."], "tip": "El agua de la pasta es el secreto de los restaurantes: su almidón une la salsa con la pasta y le da brillo. Nunca la tires antes de terminar el platillo.", "royalTip": "El fondo de tu Olla Royal Prestige reparte el calor sin puntos calientes, así la crema no se corta ni se pega. Puedes hacer la salsa a fuego bajo con total confianza."}, {"id": "flan-casero", "name": "Flan Casero", "time": "50 min", "servings": "8 porciones", "diff": "Media", "utensil": "Olla Royal Prestige", "cats": ["ollas", "postres"], "badge": "Fácil para principiantes", "desc": "Un flan suave, cremoso y perfecto preparado a baño María.", "img": "", "tone": "#6B4A22", "video": "", "ingredients": [{"name": "Leche condensada", "amount": "1 lata"}, {"name": "Leche evaporada", "amount": "1 lata"}, {"name": "Huevos", "amount": "4"}, {"name": "Vainilla", "amount": "1 cda"}, {"name": "Azúcar (para el caramelo)", "amount": "media taza"}], "steps": ["Derrite el azúcar en un molde a fuego bajo, moviéndolo con cuidado, hasta obtener un caramelo dorado. Cubre el fondo y deja enfriar.", "Licúa la leche condensada, la leche evaporada, los huevos y la vainilla durante 1 minuto, hasta integrar por completo.", "Vierte la mezcla sobre el caramelo y cubre el molde con papel aluminio bien ajustado.", "Coloca el molde dentro de tu olla con <b>agua hasta la mitad del molde</b> (baño María). Tapa y cocina a fuego bajo durante <b>40 minutos</b>.", "Está listo cuando un cuchillo insertado al centro sale limpio. Refrigera <b>mínimo 4 horas</b> antes de desmoldar.", "Para desmoldar, pasa un cuchillo por la orilla, coloca un plato encima y voltea con un movimiento firme."], "tip": "La paciencia hace el flan: fuego bajo y   let DATA = { recipes:[], reviews:[], gallery:[], soon:[], texts:{}, config:{}, featured:null, rstats:{} };

  function setCloud(saving){
    const c=$("cloudState"); if(!c) return;

  // ---------- Login ----------
  function showMsg(t,k){ const m=$("loginMsg"); m.textContent=t; m.className="msg show "+(k||"err"); }
  function clearMsg(){ $("loginMsg").className="msg"; }
  setPersistence(auth, browserLocalPersistence).catch(()=>{});

  provider.setCustomParameters({ prompt:"select_account" });
  let busy=false;
  $("googleBtn").addEventListener("click", async ()=>{
    if(busy) return; busy=true; $("googleBtn").disabled=true; clearMsg();
    try{ await signInWithPopup(auth, provider); }
    catch(e){
      if(e.code==="auth/popup-closed-by-user"||e.code==="auth/cancelled-popup-request"){ clearMsg(); }
      else if(e.code==="auth/network-request-failed"){ showMsg("No hay conexión. Verifica tu internet."); }
      else if(e.code==="auth/unauthorized-domain"){ showMsg("Este dominio aún no está autorizado en Firebase. Agrégalo en Authentication → Settings → Dominios autorizados."); }

      purgeOldTrash();

  // ---------- Carga o auto-siembra ----------
  async function loadOrSeed(){
    const snap = await getDocs(collection(db,"recipes"));
    if(snap.empty){
      $("loadingTxt").textContent = "Preparando tu oficina por primera vez…";
      await seedEverything();
    }
    await loadAll();
  }

  function clean(obj){
    if(Array.isArray(obj)) return obj.map(clean).filter(v=>v!==undefined);
    if(obj && typeof obj==="object"){
      const o={};
      for(const k in obj){ const v=clean(obj[k]); if(v!==undefined) o[k]=v; }
      return o;
    }
    return obj===undefined ? null : obj;
  }
  async function seedEverything(){
    const batch = writeBatch(db);
    SEED.recipes.forEach((r,i)=>{
      const ref = doc(db,"recipes", r.id || ("rec"+i));
      batch.set(ref, clean({ ...r, order:i, status:"published", visible:true }));
    });
    SEED.reviews.forEach((r,i)=>{
      const ref = doc(db,"testimonials","seed-rev-"+i);
      batch.set(ref, clean({ ...r, order:i, status:"published", visible:true }));
    });
    SEED.gallery.forEach((g,i)=>{
      const ref = doc(db,"gallery","seed-gal-"+i);
      batch.set(ref, clean({ ...g, order:i, status:"published", visible:true }));
    });
    SEED.soon.forEach((s,i)=>{
      const ref = doc(db,"upcoming","seed-soon-"+i);
      batch.set(ref, clean({ ...s, order:i }));
    });
    batch.set(doc(db,"settings","public"), clean({ ...SEED.config, texts:SEED.texts }));
    await batch.commit();
  }

  async function loadAll(){
    const [rec, tes, gal, up, set] = await Promise.all([
      getDocs(collection(db,"recipes")),
      getDocs(collection(db,"testimonials")),
      getDocs(collection(db,"gallery")),
      getDocs(collection(db,"upcoming")),
      getDocs(collection(db,"settings"))
    ]);
    DATA.recipes = rec.docs.map(d=>({_id:d.id,...d.data()})).sort((a,b)=>(a.order||0)-(b.order||0));
    DATA.reviews = tes.docs.map(d=>({_id:d.id,...d.data()})).sort((a,b)=>(a.order||0)-(b.order||0));
    DATA.gallery = gal.docs.map(d=>({_id:d.id,...d.data()})).sort((a,b)=>(a.order||0)-(b.order||0));
    DATA.soon = up.docs.map(d=>({_id:d.id,...d.data()})).sort((a,b)=>(a.order||0)-(b.order||0));
    const pub = set.docs.find(d=>d.id==="public");
    if(pub){ const p=pub.data(); DATA.config=p; DATA.texts=p.texts||{}; }
    const feat = set.docs.find(d=>d.id==="featured");
    DATA.featured = feat ? feat.data() : null;
    try{
      const rst = await getDocs(collection(db,"recipeStats"));
      DATA.rstats = {};
      rst.docs.forEach(d=>{ const x=d.data()||{}; DATA.rstats[d.id]={likes:x.likes||0, saves:x.saves||0}; });
    }catch(e){ DATA.rstats = {}; }
  }

  // ---------- Limpieza de duplicados ----------
  async function dedupeCollection(coll, sigFn){
    const snap = await getDocs(collection(db, coll));
    const seen = new Set();
    const toDelete = [];
    snap.docs
      .slice()
      .sort((a,b)=>((a.data().order||0)-(b.data().order||0)))
      .forEach(d=>{
        const sig = sigFn(d.data() || {});
        if(seen.has(sig)) toDelete.push(d.id);
        else seen.add(sig);
      });
    for(let k=0; k<toDelete.length; k+=400){
      const batch = writeBatch(db);
      toDelete.slice(k, k+400).forEach(id=> batch.delete(doc(db, coll, id)));
      await batch.commit();
    }
    return toDelete.length;
  }

  async function countDuplicates(){
    try{
      const g = (await getDocs(collection(db,"gallery"))).docs;
      const r = (await getDocs(collection(db,"testimonials"))).docs;
      const s = (await getDocs(collection(db,"upcoming"))).docs;
      function dupes(docs, sigFn){
        const seen=new Set(); let n=0;
        docs.forEach(d=>{ const sig=sigFn(d.data()||{}); if(seen.has(sig)) n++; else seen.add(sig); });
        return n;
      }
      return dupes(g, d=>(d.src||'')+'|'+(d.alt||'')+'|'+(d.tag||''))
           + dupes(r, d=>(d.name||'')+'|'+(d.text||''))
           + dupes(s, d=>(d.name||''));
    }catch(e){ return 0; }
  }

  /* ---------- Receta de la semana ---------- */
  function rswSemanaISO(d){
    const f = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    const dia = f.getUTCDay() || 7;
    f.setUTCDate(f.getUTCDate() + 4 - dia);
    const ini = new Date(Date.UTC(f.getUTCFullYear(), 0, 1));
    return { semana: Math.ceil(((f - ini) / 86400000 + 1) / 7), anio: f.getUTCFullYear() };
  }
  /* Misma regla que usa la página pública, para que coincidan siempre */
  function rswResolver(){
    const lista = DATA.recipes.filter(r=>r.status==="published" && r.visible!==false)
                              .sort((a,b)=>(a.order||0)-(b.order||0));
    if(!lista.length) return null;
    const cfg = DATA.featured;
    if(cfg && cfg.mode === "manual" && cfg.recipeId){
      const existe = lista.find(r=>r._id === cfg.recipeId);
      const hoy = new Date(); hoy.setHours(0,0,0,0);
      const desde = cfg.from ? new Date(cfg.from + "T00:00:00") : null;
      const hasta = cfg.to   ? new Date(cfg.to   + "T23:59:59") : null;
      const vigente = (!desde || hoy >= desde) && (!hasta || new Date() <= hasta);
      if(existe && vigente) return { r: existe, modo: "manual", desde: cfg.from, hasta: cfg.to };
    }
    const s = rswSemanaISO(new Date());
    return { r: lista[(s.anio*53 + s.semana) % lista.length], modo: "auto" };
  }

  async function rswPintarAna(){
    const cont = $("rswAna");
    if(!cont) return;
    let data;
    try{ data = await loadAnalytics(); }
    catch(e){ cont.innerHTML = '<div class="empty-note">No se pudo cargar la analítica.</div>'; return; }

    const corte = RSW_DIAS > 0 ? Date.now() - RSW_DIAS*86400000 : 0;
    const rows = data.filter(function(r){ return RSW_DIAS===0 ? true : (r.t>0 && r.t>=corte); });

    /* Índice por nombre y por id, porque las vistas llegan con el nombre */
    const porId = {}, porNombre = {};
    DATA.recipes.forEach(function(r){
      porId[r._id] = r;
      if(r.name) porNombre[String(r.name).toLowerCase().trim()] = r;
    });
    function receta(etiqueta, prefijo){
      const v = etiqueta.slice(prefijo.length).trim();
      return porId[v] || porNombre[v.toLowerCase()] || null;
    }

    /* Veces destacada: historial guardado + la que está activa ahora */
    const vecesDest = {};
    const cfg = DATA.featured || {};
    (cfg.history || []).forEach(function(x){
      if(x && x.recipeId) vecesDest[x.recipeId] = (vecesDest[x.recipeId]||0) + 1;
    });
    const actual = rswResolver();
    if(actual) vecesDest[actual.r._id] = (vecesDest[actual.r._id]||0) + 1;

    const M = {};
    function fila(r){
      if(!M[r._id]) M[r._id] = { r:r, vistas:0, likes:0, saves:0, clics:0, dest:0, ult:0 };
      return M[r._id];
    }
    let totalLikes = 0, totalSaves = 0, clicsDest = 0, ultima = 0;

    rows.forEach(function(x){
      const L = x.label || "";
      let r = null, campo = null;
      if(L.indexOf("Receta abierta: ") === 0){ r = receta(L,"Receta abierta: "); campo = "vistas"; }
      else if(L.indexOf("Receta me gusta: ") === 0){ r = receta(L,"Receta me gusta: "); campo = "likes"; }
      else if(L.indexOf("Receta guardada: ") === 0){ r = receta(L,"Receta guardada: "); campo = "saves"; }
      else if(L.indexOf("Receta destacada abierta: ") === 0){ r = receta(L,"Receta destacada abierta: "); campo = "clics"; clicsDest++; }
      else if(L.indexOf("Receta destacada vista: ") === 0){ r = receta(L.split(" (")[0],"Receta destacada vista: "); campo = "dest"; }
      if(!r || !campo) return;
      const f = fila(r);
      f[campo]++;
      if(x.t > f.ult) f.ult = x.t;
      if(x.t > ultima) ultima = x.t;
    });

    /* Los totales de me gusta y guardados vienen de los contadores reales */
    Object.keys(DATA.rstats).forEach(function(id){
      const st = DATA.rstats[id];
      totalLikes += st.likes || 0;
      totalSaves += st.saves || 0;
      if(porId[id]){ const f = fila(porId[id]); f.likesTot = st.likes||0; f.savesTot = st.saves||0; }
    });

    const lista = Object.keys(M).map(function(k){ return M[k]; });
    const fecha = function(t){ return t ? new Date(t).toLocaleDateString("es-MX",{day:"numeric",month:"short"}) : "—"; };
    const top = function(campo){
      return lista.slice().sort(function(a,b){ return (b[campo]||0)-(a[campo]||0); }).filter(function(x){ return (x[campo]||0)>0; }).slice(0,5);
    };

    let h = '';
    h += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:14px">';
    [["Me gusta en total",totalLikes],["Guardados en total",totalSaves],
     ["Clics en la destacada",clicsDest],["Última interacción",fecha(ultima)]].forEach(function(x){
      h += '<div class="stat-card" style="background:var(--card);border:1px solid rgba(212,175,55,.15);border-radius:16px;padding:14px;text-align:center">'+
           '<div style="font-size:20px;font-weight:800;font-family:\'Inter Tight\',sans-serif">'+x[1]+'</div>'+
           '<div style="font-size:11.5px;color:#C2B7A3;margin-top:4px">'+x[0]+'</div></div>';
    });
    h += '</div>';

    /* Rendimiento de la destacada actual */
    if(actual){
      const f = M[actual.r._id] || {vistas:0,likes:0,saves:0,clics:0};
      const st = DATA.rstats[actual.r._id] || {likes:0,saves:0};
      h += '<div style="background:rgba(255,255,255,.05);border:1px solid rgba(232,199,102,.28);border-radius:14px;padding:12px;margin-bottom:14px">'+
           '<div style="font-size:11.5px;font-weight:700;color:#F2DC8E;letter-spacing:.05em">DESTACADA AHORA · '+(actual.modo==="manual"?"ELEGIDA POR TI":"AUTOMÁTICA")+'</div>'+
           '<b style="font-size:15px;display:block;margin-top:3px">'+esc(actual.r.name)+'</b>'+
           '<div style="font-size:13px;color:#C2B7A3;margin-top:5px">'+
           (f.vistas||0)+' vistas · '+(f.clics||0)+' clics en «Ver receta completa» · '+
           (st.likes||0)+' me gusta · '+(st.saves||0)+' guardados</div></div>';
    }

    /* Podios */
    const podio = function(titulo, campo, sufijo){
      const t = top(campo);
      if(!t.length) return '';
      let x = '<div style="margin-bottom:12px"><div style="font-size:11.5px;font-weight:700;color:#A69C88;letter-spacing:.05em;text-transform:uppercase;margin-bottom:6px">'+titulo+'</div>';
      t.forEach(function(f,i){
        x += '<div style="display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:5px 0;border-bottom:1px solid rgba(212,175,55,.13)">'+
             '<span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+(i+1)+'. '+esc(f.r.name)+'</span>'+
             '<b style="flex:0 0 auto">'+(f[campo]||0)+' '+sufijo+'</b></div>';
      });
      return x + '</div>';
    };
    h += podio("Más vistas","vistas","vistas");
    h += podio("Con más me gusta","likesTot","me gusta");
    h += podio("Más guardadas","savesTot","guardados");

    /* Tabla completa */
    if(lista.length){
      const ord = lista.slice().sort(function(a,b){ return (b.vistas||0)-(a.vistas||0); });
      h += '<div style="overflow-x:auto;margin-top:6px"><table style="width:100%;border-collapse:collapse;font-size:12.5px;min-width:640px">';
      h += '<tr style="text-align:left;color:#A69C88;font-size:11.5px">'+
           ['Receta','Vistas','Me gusta (total)','Guardados (total)','Clics','Tasa guardado','Tasa me gusta','Veces destacada']
             .map(function(c){ return '<th style="padding:7px 8px;white-space:nowrap">'+c+'</th>'; }).join('')+'</tr>';
      ord.forEach(function(f){
        const v = f.vistas || 0;
        const lk = f.likesTot || 0, sv = f.savesTot || 0;
        /* Las tasas comparan actividad del MISMO periodo, nunca totales históricos */
        const tg = v ? Math.min(100, Math.round((f.saves||0)/v*100))+'%' : '—';
        const tl = v ? Math.min(100, Math.round((f.likes||0)/v*100))+'%' : '—';
        h += '<tr style="border-top:1px solid rgba(212,175,55,.13)">'+
             '<td style="padding:7px 8px;max-width:170px">'+esc(f.r.name)+'</td>'+
             '<td style="padding:7px 8px">'+v+'</td>'+
             '<td style="padding:7px 8px">'+lk+'</td>'+
             '<td style="padding:7px 8px">'+sv+'</td>'+
             '<td style="padding:7px 8px">'+(f.clics||0)+'</td>'+
             '<td style="padding:7px 8px">'+tg+'</td>'+
             '<td style="padding:7px 8px">'+tl+'</td>'+
             '<td style="padding:7px 8px">'+(vecesDest[f.r._id]||0)+'</td></tr>';
      });
      h += '</table></div>';
    }else{
      h += '<div class="empty-note">Todavía no hay datos en este periodo.</div>';
    }

    /* Historial de destacadas */
    const hist = (cfg.history || []).slice(0, 12);
    h += '<div style="margin-top:16px"><div style="font-size:11.5px;font-weight:700;color:#A69C88;letter-spacing:.05em;text-transform:uppercase;margin-bottom:6px">Historial de destacadas</div>';
    if(actual){
      const f = M[actual.r._id] || {};
      h += '<div style="font-size:13px;padding:7px 0;border-bottom:1px solid rgba(212,175,55,.13)">'+
           '<b>'+esc(actual.r.name)+'</b> · <span style="color:rgba(93,224,138,.40);font-weight:600">Actual</span> · '+

  // ---- Arrastre táctil para reordenar la galería ----
  function initGalDrag(){
    const list = $("galList"); if(!list) return;
    let dragEl=null, dragIdx=-1, startY=0, curY=0, placeholder=null;

    list.querySelectorAll(".gal-row").forEach(row=>{
      const handle = row.querySelector(".drag-handle");
      if(!handle) return;
      const start = (clientY)=>{
        dragEl = row; dragIdx = parseInt(row.dataset.idx,10);
        startY = clientY; curY = clientY;
        row.classList.add("dragging");
        placeholder = document.createElement("div");
        placeholder.className = "gal-placeholder";
        placeholder.style.height = row.offsetHeight+"px";
        row.parentNode.insertBefore(placeholder, row.nextSibling);
        row.style.position="relative"; row.style.zIndex="50";
        document.body.style.userSelect="none";
      };
      const move = (clientY)=>{
        if(!dragEl) return;
        curY = clientY;
        const dy = curY - startY;
        dragEl.style.transform = "translateY("+dy+"px)";
        // encontrar sobre qué fila estamos
        const rows = [...list.querySelectorAll(".gal-row:not(.dragging)")];
        const dragRect = dragEl.getBoundingClientRect();
        const dragMid = dragRect.top + dragRect.height/2;
        let ref=null;
        for(const r of rows){
          const rect=r.getBoundingClientRect();
          if(dragMid < rect.top + rect.height/2){ ref=r; break; }
        }
        if(ref) list.insertBefore(placeholder, ref);
        else list.appendChild(placeholder);
      };
      const end = async ()=>{
        if(!dragEl) return;
        const rows=[...list.querySelectorAll(".gal-row, .gal-placeholder")];
        const newPos = rows.indexOf(placeholder);
        dragEl.style.transform=""; dragEl.style.position=""; dragEl.style.zIndex="";
        dragEl.classList.remove("dragging");
        list.insertBefore(dragEl, placeholder);
        placeholder.remove();
        document.body.style.userSelect="";
        // calcular índice destino real
        let target = [...list.querySelectorAll(".gal-row")].indexOf(dragEl);
        const from = dragIdx; dragEl=null;
        if(target!==from && target>=0){ await reorderGal(from, target); }
      };

      // touch
      handle.addEventListener("touchstart", e=>{ e.preventDefault(); start(e.touches[0].clientY); }, {passive:false});
      list.addEventListener("touchmove", e=>{ if(dragEl){ e.preventDefault(); move(e.touches[0].clientY);} }, {passive:false});
      handle.addEventListener("touchend", end);
      // mouse (por si usa compu)
      handle.addEventListener("mousedown", e=>{ e.preventDefault(); start(e.clientY);
        const mm=ev=>move(ev.clientY); const mu=()=>{ end(); document.removeEventListener("mousemove",mm); document.removeEventListener("mouseup",mu); };
        document.addEventListener("mousemove",mm); document.addEventListener("mouseup",mu);
      });
    });
  }

  var ANALYTICS = null, anaRange = 7;
  function anaEsc(s){ return String(s||'').replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  async function loadAnalytics(force){
    if(ANALYTICS && !force) return ANALYTICS;
    const snap = await getDocs(collection(db, "analytics_clicks"));
    ANALYTICS = snap.docs.map(function(d){
      const x = d.data() || {};
      let t = 0;
      if(x.createdAt && typeof x.createdAt.toMillis === "function") t = x.createdAt.toMillis();
      else if(x.createdAt && x.createdAt.seconds) t = x.createdAt.seconds * 1000;
      return { label:x.label||"?", vid:x.vid||"", sid:x.sid||"", src:x.src||"", dev:x.dev||"",
               page:x.page||"", ref:x.referrer||"", t:t };
    });
    return ANALYTICS;
  }

  window.setAnaRange = function(d){ anaRange = d; renderAnalytics(); };

  // Un evento cuenta como CONTACTO si el visitante intentó comunicarse
  const ES_CONTACTO = ["WhatsApp","Solicitar servicio","Consulta ciudad","WhatsApp desde receta"];
  const ES_RESERVA  = ["Reserva: abre calendario"];

  async function renderAnalytics(){
    const cont = $("p-analitica");
    if(!ANALYTICS) cont.innerHTML = '<div class="empty-note">Cargando analítica…</div>';
    let data;
    try { data = await loadAnalytics(); }
    catch(e){ cont.innerHTML = '<div class="empty-note">No se pudo cargar la analítica. Revisa tu conexión.</div>'; return; }

    const now = Date.now();
    const cut = anaRange > 0 ? now - anaRange*86400000 : 0;
    const rows = data.filter(function(r){ return anaRange===0 ? true : (r.t>0 && r.t>=cut); });

    // --- Visitas y visitantes únicos ---
    const visitas = rows.filter(function(r){ return r.label==="Visita"; });
    const unicos = new Set(visitas.map(function(r){ return r.vid; }).filter(Boolean)).size;
    const totalVisitas = visitas.length;

    // --- Conversión sobre visitantes únicos ---
    const vidsContacto = new Set(rows.filter(function(r){ return ES_CONTACTO.indexOf(r.label)>=0; }).map(function(r){ return r.vid; }).filter(Boolean));
    const vidsReserva  = new Set(rows.filter(function(r){ return ES_RESERVA.indexOf(r.label)>=0; }).map(function(r){ return r.vid; }).filter(Boolean));
    const pctContacto = unicos>0 ? Math.round(vidsContacto.size/unicos*1000)/10 : 0;
    const pctReserva  = unicos>0 ? Math.round(vidsReserva.size/unicos*1000)/10 : 0;

    // --- Agrupaciones ---
    function agrupar(lista, campo){
      const o = {};
      lista.forEach(function(r){ const k = r[campo] || "—"; o[k] = (o[k]||0)+1; });
      return Object.keys(o).sort(function(a,b){ return o[b]-o[a]; }).map(function(k){ return [k,o[k]]; });
    }
    /* Botones retirados del sitio: sus clics históricos ya no se muestran */
    const ANA_RETIRADOS = ["Categoria: Sistemas de cocina", "Categoria: Servicio y garantia"];
    const eventos = rows.filter(function(r){ return r.label!=="Visita" && ANA_RETIRADOS.indexOf(r.label)<0; });
    const porEvento = agrupar(eventos, "label");
    const porFuente = agrupar(visitas, "src");
    const porDisp   = agrupar(visitas, "dev");
    const maxEv = Math.max(1, ...porEvento.map(function(x){ return x[1]; }));

    function esc2(s){ return String(s||"").replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
    function lista(arr, total){
      if(!arr.length) return '<div class="empty-note">Sin datos todavía.</div>';
      return arr.map(function(x){
        const pct = total>0 ? Math.round(x[1]/total*100) : 0;
        return '<div class="ana-ref"><span>'+esc2(x[0])+'</span><b>'+x[1]+(total>0?' <i>('+pct+'%)</i>':'')+'</b></div>';
      }).join("");
    }

    let html = '<div class="dash-hi"><h2>Analítica</h2><p>Qué hacen tus visitantes. Se actualiza solo.</p></div>';
    html += '<div class="ana-filter">' +
      [[7,'7 días'],[30,'30 días'],[0,'Todo']].map(function(o){
        return '<button class="ana-chip'+(anaRange===o[0]?' on':'')+'" type="button" onclick="setAnaRange('+o[0]+')">'+o[1]+'</button>';
      }).join('') + '</div>';

    html += '<div class="ana-cards">' +
      '<div class="ana-card"><div class="ana-n">'+unicos+'</div><div class="ana-l">Personas únicas</div></div>' +
      '<div class="ana-card"><div class="ana-n">'+totalVisitas+'</div><div class="ana-l">Visitas totales</div></div>' +
      '<div class="ana-card"><div class="ana-n">'+eventos.length+'</div><div class="ana-l">Acciones</div></div>' +
      '</div>';

    html += '<div class="conv-box">' +
      '<div class="conv-row"><div><b>'+pctContacto+'%</b><span>Conversión a contacto</span></div><div class="conv-d">'+vidsContacto.size+' de '+unicos+' personas te escribieron</div></div>' +
      '<div class="conv-row"><div><b>'+pctReserva+'%</b><span>Conversión a reserva</span></div><div class="conv-d">'+vidsReserva.size+' de '+unicos+' abrieron el calendario</div></div>' +
      '</div>';

    html += '<h3 class="ana-h">Qué hacen en tu sitio</h3>';
    if(!porEvento.length) html += '<div class="empty-note">Aún no hay acciones en este periodo.</div>';
    else porEvento.forEach(function(x){
      const pct = Math.round(x[1]/maxEv*100);
      html += '<div class="ana-bar"><div class="ana-bar-top"><span>'+esc2(x[0])+'</span><b>'+x[1]+'</b></div>'+
              '<div class="ana-track"><div class="ana-fill" style="width:'+pct+'%"></div></div></div>';
    });

    html += '<h3 class="ana-h">De dónde llegan</h3>' + lista(porFuente, totalVisitas);
    html += '<h3 class="ana-h">Con qué dispositivo</h3>' + lista(porDisp, totalVisitas);

    html += anaGuardarOficina(rows);

    html += '<p class="ana-tip">Para saber si tus QR funcionan, usa un enlace con etiqueta: <b>lettytrillo.com/?utm_source=qr</b>. Lo mismo para Instagram (<b>?utm_source=instagram</b>) o TikTok (<b>?utm_source=tiktok</b>).</p>';
    html += '<button class="btn btn-line btn-block" type="button" onclick="reloadAnalytics()" style="margin-top:18px">↻ Actualizar datos</button>';
    cont.innerHTML = html;
  }

  function downloadFile(name, content, mime){

    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 2000);
  }

  // ---------- Papelera (30 días) ----------
  const TRASH_DAYS = 30;
  const COLL_ES = { recipes:"Receta", testimonials:"Opinión", gallery:"Foto", upcoming:"Próximamente",
    giftClaims:"Persona con regalo", giftParticipants:"Participante", giftLinks:"Enlace de campaña",
    passportUsers:"Viajero del pasaporte", passportPhotos:"Foto del pasaporte",
    helpRequests:"Solicitud de ayuda", appointments:"Cita" };

  async function softDelete(coll, id, item, label, kind){
    setCloud(true);
    try{
      const payload = {};
      for(const k in item){ if(k !== "_id") payload[k] = item[k]; }
      await setDoc(doc(db, "trash", coll + "__" + id), clean({
        origColl: coll, origId: id, label: String(label||"Elemento").slice(0,80),
        kind: kind || COLL_ES[coll] || "Elemento",
        payload: payload, deletedAt: serverTimestamp()
      }));
      await deleteDoc(doc(db, coll, id));
    } finally { setCloud(false); }
  }

  function trashMillis(x){
    if(x && typeof x.toMillis === "function") return x.toMillis();
    if(x && x.seconds) return x.seconds * 1000;
    return Date.now();
  }

  async function purgeOldTrash(){
    try{
      const snap = await getDocs(collection(db, "trash"));
      const cut = Date.now() - TRASH_DAYS * 86400000;
      const old = snap.docs.filter(d => trashMillis((d.data()||{}).deletedAt) < cut);
      if(!old.length) return;
      const batch = writeBatch(db);
      old.forEach(d => batch.delete(doc(db, "trash", d.id)));
      await batch.commit();
    }catch(e){ /* silencioso */ }
  }

  let TRASH = [];
  async function loadTrash(){
    const snap = await getDocs(collection(db, "trash"));
    TRASH = snap.docs.map(d => ({ _tid: d.id, ...(d.data()||{}) }))
      .sort((a,b) => trashMillis(b.deletedAt) - trashMillis(a.deletedAt));
  }

  window.renderTrash = async function(){
    const cont = $("p-papelera");
    cont.innerHTML = '<div class="empty-note">Cargando papelera…</div>';
    try{ await loadTrash(); }
    catch(e){ cont.innerHTML = '<div class="empty-note">No se pudo cargar la papelera. Revisa tu conexión.</div>'; return; }

    let html = '<div class="dash-hi"><h2>Papelera</h2><p>Lo que elimines espera aquí ' + TRASH_DAYS + ' días. Puedes restaurarlo o borrarlo definitivamente. Pasado ese tiempo se borra solo.</p></div>';
    if(!TRASH.length){
      html += '<div class="empty-note">La papelera está vacía. ✨</div>';
      cont.innerHTML = html; return;
    }
    TRASH.forEach(function(t, i){
      const dias = Math.max(0, TRASH_DAYS - Math.floor((Date.now() - trashMillis(t.deletedAt)) / 86400000));
      html += '<div class="item"><div class="item-info">'+
        '<div class="item-name">'+ (t.label ? String(t.label).replace(/[&<>]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])) : "Elemento") +'</div>'+
        '<div class="item-sub">'+ (t.kind || COLL_ES[t.origColl] || "") + ' · se borra en ' + dias + (dias===1?' día':' días') + '</div></div>'+
        '<div class="item-actions">'+
        '<button class="icon-btn" onclick="restoreTrash('+i+')" aria-label="Restaurar" title="Restaurar">↩︎</button>'+
        '<button class="icon-btn" onclick="hardDeleteTrash('+i+')" aria-label="Borrar definitivamente" title="Borrar definitivamente">✕</button>'+
        '</div></div>';
    });
    cont.innerHTML = html;
  };

  window.restoreTrash = async function(i){
    const t = TRASH[i]; if(!t) return;
    setCloud(true);
    try{
      await setDoc(doc(db, t.origColl, t.origId), clean(t.payload || {}));
      await deleteDoc(doc(db, "trash", t._tid));
      try{ if(String(t.origColl).indexOf("gift")===0) rygLoaded = false; }catch(e){}
      try{ if(String(t.origColl).indexOf("passport")===0){ renderPassportAdmin._cached = false; ppUsers=[]; ppPhotos=[]; ppRoutes=null; } }catch(e){}
      try{ if(t.origColl === "helpRequests") ayCargado = false; }catch(e){}
      await loadAll(); renderAll();

  const FUENTES = [
    { tab:"agenda",     coll:"appointments",      nombre:"reservas" },
    { tab:"ayuda",      coll:"helpRequests",      nombre:"solicitudes" },
    { tab:"regalayg",   coll:"giftParticipants",  nombre:"de Regala y Gana" },

  ];
  const VISTO = "panelVisto:";
  let NOVEDADES = {};

  async function contarNovedades(){
    for(const f of FUENTES){
      try{
        const snap = await getCountFromServer(collection(db, f.coll));
        const total = snap.data().count;
        const antes = parseInt(localStorage.getItem(VISTO + f.coll) || "-1", 10);
        if(antes < 0){
          // Primera vez: no marcamos nada como nuevo, solo guardamos la foto actual.
          localStorage.setItem(VISTO + f.coll, String(total));
          NOVEDADES[f.tab] = 0;
        }else{
          NOVEDADES[f.tab] = Math.max(0, total - antes);
        }
        NOVEDADES["_total_" + f.tab] = total;
      }catch(e){ NOVEDADES[f.tab] = 0; }
    }
    pintarAvisos();
  }
  function pintarAvisos(){
    document.querySelectorAll(".tab").forEach(t => {
      const n = NOVEDADES[t.dataset.tab] || 0;

        b.textContent = n > 99 ? "99+" : n;
      }else if(b){ b.remove(); }

    const partes = FUENTES.filter(f => (NOVEDADES[f.tab] || 0) > 0)
      .map(f => '<button type="button" class="aviso-item" onclick="goTab(\'' + f.tab + '\')">' +
                '<b>' + NOVEDADES[f.tab] + '</b> ' + f.nombre + '</button>');
    if(!partes.length){ caja.style.display = "none"; caja.innerHTML = ""; return; }
    caja.style.display = "";

                     '<div class="aviso-row">' + partes.join('') + '</div>';
  }
  function marcarVisto(tab){
    const f = FUENTES.find(x => x.tab === tab);
    if(!f) return;
    const total = NOVEDADES["_total_" + tab];

    NOVEDADES[tab] = 0;
    pintarAvisos();

  /* ==================================================================
     NOTIFICACIONES DEL PANEL
     ------------------------------------------------------------------
     En iPhone, Apple solo permite notificaciones web si el panel esta
     INSTALADO en la pantalla de inicio y se abre desde ese icono.
     Abierto desde Safari nunca funciona, por diseño de Apple. Por eso
     lo primero que hace esta barra es detectar en cual de los dos
     estados estas y decirte exactamente que falta.
     ================================================================== */
  const VAPID_PUBLICA = "BMp5v1Fpc06dTDL9mGu5ih94FwGnoWkOkSa7LvDLWK9Rtw_tzvyEmJf1mZMt1aYizEpjEVqGOFTUzZRCISKGNNg";

  function esIOS(){
    return /iPad|iPhone|iPod/.test(navigator.userAgent)
        || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  }
  function estaInstalado(){
    return window.matchMedia("(display-mode: standalone)").matches
        || window.navigator.standalone === true;
  }
  function haySoporte(){
    return ("serviceWorker" in navigator) && ("PushManager" in window) && ("Notification" in window);
  }
  function b64aBytes(base64){
    const pad = "=".repeat((4 - base64.length % 4) % 4);
    const b64 = (base64 + pad).replace(/-/g, "+").replace(/_/g, "/");
    const bruto = atob(b64);
    const bytes = new Uint8Array(bruto.length);
    for(let i = 0; i < bruto.length; i++) bytes[i] = bruto.charCodeAt(i);
    return bytes;
  }
  function idDeSub(sub){
    // Un identificador estable y corto a partir del endpoint.
    const e = sub.endpoint || "";
    let x = 0;
    for(let i = 0; i < e.length; i++){ x = ((x << 5) - x + e.charCodeAt(i)) | 0; }
    return "s" + Math.abs(x).toString(36) + "_" + e.slice(-12).replace(/[^a-zA-Z0-9]/g, "");
  }

  let SW_REG = null;

  async function registrarSW(){
    if(!haySoporte()) return null;
    try{
      SW_REG = await navigator.serviceWorker.register("sw-panel.js", { scope: "/" });
      return SW_REG;
    }catch(e){ return null; }
  }

  async function guardarSub(sub){
    const json = sub.toJSON();
    await setDoc(doc(db, "pushSubs", idDeSub(sub)), {
      endpoint: sub.endpoint,
      p256dh: json.keys && json.keys.p256dh,
      auth:   json.keys && json.keys.auth,
      agente: navigator.userAgent.slice(0, 180),
      creado: serverTimestamp()
    });
  }

  window.activarPush = async function(){
    const btn = document.getElementById("pbActivar");
    if(btn){ btn.disabled = true; btn.textContent = "Activando…"; }
    try{
      const permiso = await Notification.requestPermission();
      if(permiso !== "granted"){ pintarPush(); return; }
      const reg = SW_REG || await registrarSW();
      if(!reg){ toast("No se pudo preparar el servicio"); pintarPush(); return; }
      await navigator.serviceWorker.ready;
      let sub = await reg.pushManager.getSubscription();
      if(!sub){
        sub = await reg.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: b64aBytes(VAPID_PUBLICA)
        });
      }
      await guardarSub(sub);
      toast("Notificaciones activadas");
      pintarPush();
    }catch(e){
      toast("No se pudieron activar: " + (e && e.message ? e.message : "error"));
      pintarPush();
    }
  };

    try{

  window.desactivarPush = async function(){

      }

  async function pintarPush(){
    const el = document.getElementById("pushBar");
    if(!el) return;
    el.className = "";

    if(!haySoporte()){
      el.style.display = "";
      el.innerHTML = '<div class="pb-txt"><b>Este navegador no admite notificaciones</b>' +
        'Abre el panel en Safari o Chrome actualizados.</div>';
      return;
    }

    if(esIOS() && !estaInstalado()){
      el.style.display = "";
      el.className = "aviso";
      el.innerHTML = '<div class="pb-txt"><b>Instala el panel para recibir avisos</b>' +
        'En iPhone y iPad, Apple solo permite notificaciones si abres el panel desde su icono. ' +
        'Toca el boton Compartir de Safari, elige <b style="display:inline">Anadir a pantalla de inicio</b> ' +
        'y desde ahora entra por ese icono.</div>';
      return;
    }

    const reg = SW_REG || await navigator.serviceWorker.getRegistration();
    const sub = reg ? await reg.pushManager.getSubscription() : null;
    const permiso = Notification.permission;

    if(permiso === "denied"){
      el.style.display = "";
      el.className = "aviso";
      el.innerHTML = '<div class="pb-txt"><b>Notificaciones bloqueadas</b>' +
        'Las rechazaste antes. Para reactivarlas: Ajustes del telefono &rarr; Notificaciones &rarr; Mi panel.</div>';
      return;
    }

    if(sub && permiso === "granted"){
      el.style.display = "";
      el.className = "ok";
      el.innerHTML = '<div class="pb-txt"><b>Notificaciones activadas</b>' +
        'Este dispositivo recibira un aviso cuando entre algo nuevo.</div>' +
        '<div class="pb-acc">' +
          '<button class="pb-b ghost" type="button" onclick="probarPush()">Probar</button>' +
          '<button class="pb-b ghost" type="button" onclick="desactivarPush()">Desactivar</button>' +
        '</div>';
      return;
    }

    el.style.display = "";
    el.innerHTML = '<div class="pb-txt"><b>Activa las notificaciones</b>' +
      'Te aviso en cuanto llegue una reserva, un prospecto o una solicitud.</div>' +
      '<div class="pb-acc"><button class="pb-b" id="pbActivar" type="button" onclick="activarPush()">Activar notificaciones</button></div>';
  }

  /* ---------- Estado de una cita ---------- */
  window.agEstado = async function(id, nuevo){
    const c = CITAS.find(x=>x._id===id);
    if(!c) return;
    if(nuevo === "cancelada" && !confirm("¿Cancelar la cita de "+(c.nombre||"")+"?\n\nEl hueco volverá a quedar libre.")) return;
    setCloud(true);
    try{
      await updateDoc(doc(db,"appointments",id), { status:nuevo, updatedAt:serverTimestamp() });
      c.status = nuevo;
      /* Al cancelar, liberar el hueco para que otro pueda tomarlo */
      if(nuevo === "cancelada"){
        try{ await deleteDoc(doc(db,"busySlots", c.fecha+"_"+String(c.hora).replace(":","-"))); }catch(e){}
      }
      toast("✓ "+(AG_EST[nuevo]||{t:nuevo}).t);
      renderAgenda();
    }catch(e){ console.error(e); toast("No se pudo cambiar"); }
    finally{ setCloud(false); }
  };

    const c = CITAS.find(x=>x._id===id);
    if(!c) return;
    const v = prompt("Nota interna (solo tú la ves):", c.notasAdmin || "");
    if(v === null) return;
    setCloud(true);
    try{

  window.agBorrar = async function(id){

    if(!confirm("¿Enviar a la papelera la cita de "+(c.nombre||"")+"?\n\nPodrás restaurarla durante 30 días.")) return;
    setCloud(true);
    try{
      const copia = {}; for(const k in c){ if(k!=="_id") copia[k]=c[k]; }

        (c.nombre||"Cita")+" · "+agFechaLarga(c.fecha)+" "+agHora12(c.hora), "Cita");

  // ==================== SOLICITUDES DE AYUDA ====================
  let AY = [], ayCargado = false, ayTipo = "todos", ayEstado = "todos", ayBusca = "", ayAbierta = "";
  let ayVista = "solicitudes", CLI = [], CLINOTAS = {}, cliAbierta = "";

  const AY_TIPOS = { producto:"Ayuda con producto", servicio:"Servicio", garantia:"Garantía",
                     llamada:"Llamada", visita:"Visita" };
  const AY_EST = {
    nueva:      { t:"Nueva",             bg:"#EAF2FB", c:"#1B4F86" },
    revision:   { t:"En revisión",       bg:"#FDF6EC", c:"#7A5C22" },
    contactado: { t:"Contactado",        bg:"#F3EFE7", c:"#66625B" },
    esperando:  { t:"Esperando respuesta",bg:"#FBF3E8", c:"#8A672B" },
    visita:     { t:"Visita programada", bg:"#F6F3E9", c:"#867B3F" },
    resuelta:   { t:"Resuelta",          bg:"#EAF5EE", c:"#1E7A46" },
    cerrada:    { t:"Cerrada",           bg:"#F1EFEC", c:"#8A8A82" }
  };
  const AY_ORDEN = ["nueva","revision","contactado","esperando","visita","resuelta","cerrada"];

  function ayEsc(t){ return esc(t); }
  function ayFecha(ts){
    if(!ts) return "—";
    const d = ts.toDate ? ts.toDate() : (ts.seconds ? new Date(ts.seconds*1000) : null);
    return d ? d.toLocaleDateString("es-MX",{day:"numeric",month:"short",year:"numeric"}) : "—";
  }
  function ayTel(t){
    const d = String(t||"").replace(/\D/g,"");
    if(d.length===11 && d[0]==="1") return "("+d.slice(1,4)+") "+d.slice(4,7)+"-"+d.slice(7);
    if(d.length===10) return "("+d.slice(0,3)+") "+d.slice(3,6)+"-"+d.slice(6);
    return t || "—";
  }
  function ayCodigo(r){
    return r.code ? String(r.code) : ("#" + String(r._id||"").slice(-6).toUpperCase());
  }
  function ayWa(t){
    const d = String(t||"").replace(/\D/g,"");
    return d.length===10 ? "1"+d : d;
  }

  async function ayCargar(forzar){
    if(ayCargado && !forzar) return;
    const snap = await getDocs(collection(db,"helpRequests"));
    AY = snap.docs.map(d=>({ _id:d.id, ...(d.data()||{}) }))
      .sort((a,b)=>{
        const ta = a.createdAt && a.createdAt.seconds ? a.createdAt.seconds : 0;
        const tb = b.createdAt && b.createdAt.seconds ? b.createdAt.seconds : 0;
        return tb - ta;
      });
    try{
      const cn = await getDocs(collection(db,"clients"));
      CLINOTAS = {};
      cn.docs.forEach(d=>{ CLINOTAS[d.id] = d.data() || {}; });
    }catch(e){ CLINOTAS = {}; }
    ayAgrupar();
    ayCargado = true;
  }

  /* ---------- Fichas de cliente ----------
     No se guardan por separado al enviar el formulario: se construyen agrupando
     las solicitudes por teléfono y por número de cuenta. Así es imposible que
     nazcan fichas duplicadas y nada anterior se sobrescribe. */
  function ayTelKey(t){
    const d = String(t||"").replace(/\D/g,"");
    return d.length >= 10 ? d.slice(-10) : (d || "");
  }
  function ayCtaKey(c){
    const v = String(c||"").replace(/[^a-zA-Z0-9]/g,"").toUpperCase();
    return v.length >= 4 ? v : "";
  }
  function ayAgrupar(){
    /* Une en un mismo grupo las solicitudes que comparten teléfono o cuenta */
    const grupos = [];
    const porTel = {}, porCta = {};
    AY.forEach(r=>{
      const tk = ayTelKey(r.phone), ck = ayCtaKey(r.cuenta);
      let g = (tk && porTel[tk] !== undefined) ? porTel[tk]
            : (ck && porCta[ck] !== undefined) ? porCta[ck] : null;
      if(g === null){ g = grupos.length; grupos.push([]); }
      grupos[g].push(r);
      if(tk) porTel[tk] = g;
      if(ck) porCta[ck] = g;
    });

    CLI = grupos.filter(g=>g.length).map(g=>{
      const orden = g.slice().sort((a,b)=>{
        const ta = a.createdAt && a.createdAt.seconds ? a.createdAt.seconds : 0;
        const tb = b.createdAt && b.createdAt.seconds ? b.createdAt.seconds : 0;
        return tb - ta;
      });
      const ult = orden[0], pri = orden[orden.length-1];
      const primero = (campo) => { for(const r of orden){ if(r[campo]) return r[campo]; } return ""; };
      const key = ayTelKey(ult.phone) || ayCtaKey(ult.cuenta) || ult._id;
      const productos = [];
      orden.forEach(r=>{ if(r.producto && productos.indexOf(r.producto) < 0) productos.push(r.producto); });
      return {
        key: key,
        nombre: primero("nombre"), apellido: primero("apellido"),
        phone: primero("phone"), cuenta: primero("cuenta"), ciudad: primero("ciudad"),
        medio: primero("medio"), horario: primero("horario"),
        productos: productos,
        creado: pri.createdAt, ultima: ult.createdAt,
        historial: orden,
        news: orden.some(r=>r.news === true),
        notas: (CLINOTAS[key] || {}).notas || ""
      };
    }).sort((a,b)=>{
      const ta = a.ultima && a.ultima.seconds ? a.ultima.seconds : 0;
      const tb = b.ultima && b.ultima.seconds ? b.ultima.seconds : 0;
      return tb - ta;
    });
  }

  window.ayBorrar = async function(id){
    const r = AY.find(x=>x._id===id);
    if(!r) return;
    if(!confirm("¿Enviar a la papelera la solicitud de "+(r.nombre||"")+" "+(r.apellido||"")+"?\n\nPodrás restaurarla durante 30 días.")) return;
    setCloud(true);
    try{
      const copia = {}; for(const k in r){ if(k!=="_id") copia[k]=r[k]; }
      await softDelete("helpRequests", id, copia,
        (r.nombre||"Solicitud")+" "+(r.apellido||"")+" · "+(AY_TIPOS[r.tipo]||r.tipo), "Solicitud de ayuda");
      AY = AY.filter(x=>x._id!==id);
      ayAgrupar();
      toast("✓ Enviada a la papelera");
      renderAyuda();
    }catch(e){ console.error(e); toast("No se pudo borrar"); }
    finally{ setCloud(false); }
  };

  let ppRoutes=null, ppUsers=[], ppPhotos=[], ppOpenRoute='', ppEditIdx=-1;

  function ppKey(r,c){ return r.id==='t1' ? c.id : r.id+'__'+c.id; }
  function ppEsc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

  async function ppLoad(){
    if(renderPassportAdmin._cached && ppRoutes) return;
    try{
      const s=await getDoc(doc(db,'settings','passport'));
      if(s.exists() && Array.isArray(s.data().routes) && s.data().routes.length){ ppRoutes=s.data().routes; }
    }catch(e){}
    if(!ppRoutes) ppRoutes=[{id:'t1',name:'Temporada 1',active:true,countries:PP_SEED}];
    try{
      const us=await getDocs(collection(db,'passportUsers'));
      ppUsers=us.docs.map(d=>({uid:d.id, ...d.data()}));
      ppUsers.sort((a,b)=>((b.createdAt&&b.createdAt.seconds)||0)-((a.createdAt&&a.createdAt.seconds)||0));
    }catch(e){ ppUsers=[]; }
    try{
      const fs=await getDocs(collection(db,'passportPhotos'));
      ppPhotos=fs.docs.map(d=>({id:d.id, ...d.data()}));
      ppPhotos.sort((a,b)=>((b.createdAt&&b.createdAt.seconds)||0)-((a.createdAt&&a.createdAt.seconds)||0));
    }catch(e){ ppPhotos=[]; }
  }

  function ppUserProg(u){
    const s=u.stamps||{};
    let best=null;
    ppRoutes.forEach(r=>{
      const done=r.countries.filter(c=>s[ppKey(r,c)]).length;
      if(done>0 || r===ppRoutes[0]){
        if(!best || done/r.countries.length > best.done/best.total)
          best={route:r.name, done:done, total:r.countries.length, full:done>=r.countries.length};
      }
    });
    return best || {route:ppRoutes[0].name, done:0, total:ppRoutes[0].countries.length, full:false};
  }

  window.ppDelUser = async function(uid){
    const u = ppUsers.find(x=>x.uid===uid);
    if(!u) return;
    const fotos = ppPhotos.filter(f=>f.uid===uid);
    if(!confirm('\u00bfEliminar a '+(u.name||'este viajero')+' del Pasaporte?\n\nSe enviar\u00e1n a la papelera:\n\u00b7 su registro y sus sellos\n\u00b7 sus '+fotos.length+' foto(s)\n\nPodr\u00e1s restaurarlo durante 30 d\u00edas.')) return;
    if(fotos.length && !confirm('Confirma una vez m\u00e1s: se eliminar\u00e1 '+(u.name||'el viajero')+' junto con sus '+fotos.length+' foto(s).')) return;
    setCloud(true);
    try{
      for(const f of fotos){
        const copia = {}; for(const k in f){ if(k!=="id") copia[k]=f[k]; }
        await softDelete("passportPhotos", f.id, copia, "Foto de "+(u.name||"viajero")+(f.co?" \u00b7 "+f.co:""), "Foto del pasaporte");
      }
      const copiaU = {}; for(const k in u){ if(k!=="uid") copiaU[k]=u[k]; }
      await softDelete("passportUsers", u.uid, copiaU, (u.name||"Viajero")+" \u00b7 Pasaporte", "Viajero del pasaporte");
      ppPhotos = ppPhotos.filter(f=>f.uid!==uid);
      ppUsers  = ppUsers.filter(x=>x.uid!==uid);
      toast("\u2713 Viajero y sus fotos enviados a la papelera");
      renderPassportAdmin.rerender();
    }catch(e){ console.error(e); toast("No se pudo eliminar al viajero"); }
    finally{ setCloud(false); }
  };

  async function ppPDF(){
    if(!ppUsers.length){ toast("No hay participantes para exportar"); return; }
    toast("Generando PDF\u2026");
    try{
      await rygCargarScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js");
      await rygCargarScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js");
    }catch(e){ toast("No se pudo cargar el generador de PDF"); return; }
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ orientation:"landscape", unit:"pt", format:"letter" });
    const W = pdf.internal.pageSize.getWidth();
    const gen = new Date().toLocaleString("es-US",{dateStyle:"long",timeStyle:"short"});
    const completos = ppUsers.filter(u=>ppUserProg(u).full).length;
    const sellos = ppUsers.reduce((acc,u)=>acc+Object.keys(u.stamps||{}).length,0);

    pdf.setFont("helvetica","bold"); pdf.setFontSize(16); pdf.setTextColor(18,42,70);
    pdf.text("Pasaporte de Sabores \u2014 Participantes", 40, 46);
    pdf.setFont("helvetica","normal"); pdf.setFontSize(10); pdf.setTextColor(90,100,115);
    pdf.text("Letty Trillo \u00b7 Royal Prestige \u00b7 Generado: "+gen, 40, 62);
    pdf.text("Viajeros: "+ppUsers.length+" \u00b7 Completaron la ruta: "+completos+" \u00b7 Sellos estampados: "+sellos+" \u00b7 Fotos recibidas: "+ppPhotos.length, 40, 76);

    pdf.autoTable({
      startY: 92,
      head: [["Nombre","WhatsApp","Ciudad","Estado","Progreso","Ruta","Complet\u00f3","Registro","Fotos"]],
      body: ppUsers.map(u=>{
        const p = ppUserProg(u);
        const f = u.createdAt && u.createdAt.seconds ? new Date(u.createdAt.seconds*1000).toLocaleDateString("es-MX") : "\u2014";
        const nf = ppPhotos.filter(x=>x.uid===u.uid).length;
        return [u.name||"\u2014", u.phone||"\u2014", u.city||"\u2014", u.state||"\u2014",
                p.done+" de "+p.total, p.route||"\u2014", p.full?"S\u00ed":"No", f, String(nf)];
      }),
      margin: { left:40, right:40, bottom:44 },
      styles: { font:"helvetica", fontSize:9, cellPadding:5, overflow:"linebreak", textColor:[35,40,50], lineColor:[235,230,222], lineWidth:0.5 },
      headStyles: { fillColor:[18,42,70], textColor:255, fontStyle:"bold", fontSize:9 },
      alternateRowStyles: { fillColor:[251,249,244] },
      columnStyles: { 0:{cellWidth:110}, 1:{cellWidth:90}, 4:{cellWidth:60,halign:"center"}, 6:{cellWidth:56,halign:"center"}, 8:{cellWidth:44,halign:"center"} },
      didDrawPage: function(){
        const H = pdf.internal.pageSize.getHeight();
        pdf.setFont("helvetica","normal"); pdf.setFontSize(8); pdf.setTextColor(120,128,140);
        pdf.text("Letty Trillo \u00b7 Pasaporte de Sabores \u00b7 "+gen, 40, H-22);
        pdf.text("P\u00e1gina "+pdf.internal.getNumberOfPages(), W-40, H-22, { align:"right" });
      }
    });
    pdf.save("pasaporte-participantes_"+rygSello()+".pdf");
    toast("\u2713 PDF descargado ("+ppUsers.length+" participantes)");
  }

  function ppBind(el){
    el.addEventListener('click', async (e)=>{
      const t=e.target;
      const del = t.closest ? t.closest("[data-ppdel]") : null;
      if(del){ ppDelUser(del.getAttribute("data-ppdel")); return; }
      if(t.id==='ppPdf'){ await ppPDF(); return; }

  function rygEsc(s){ return String(s==null?"":s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
  function rygFecha(ts){
    if(!ts) return "—";
    const d = ts.toDate ? ts.toDate() : new Date(ts);
    if(isNaN(d)) return "—";
    return d.toLocaleDateString("es-US",{day:"numeric",month:"short",year:"numeric"});
  }
  function rygTel(t){
    const d = String(t||"").replace(/\D/g,"");
    if(d.length===11 && d[0]==="1") return "("+d.slice(1,4)+") "+d.slice(4,7)+"-"+d.slice(7);
    if(d.length===10) return "("+d.slice(0,3)+") "+d.slice(3,6)+"-"+d.slice(6);
    return d||"—";
  }
  function rygMask(nombre){
    const p = String(nombre||"").trim().split(/\s+/);
    if(!p[0]) return "Contacto";
    return p[0] + (p[1] ? " " + p[1][0].toUpperCase() + "." : "");
  }
  function rygNivel(g,v){
    let n = 0;
    for(const L of RYG_LEVELS){ if(g >= L.gifts && v >= L.sales) n = L.level; }
    return n;
  }
  function rygNombrePremio(n){
    const L = RYG_LEVELS.find(x=>x.level===n);
    return L ? L.prize : "—";
  }

  async function rygLoad(force){
    if(rygLoaded && !force) return;
    const [ps, cs] = await Promise.all([
      getDocs(collection(db,"giftParticipants")),
      getDocs(collection(db,"giftClaims"))
    ]);
    rygParts  = ps.docs.map(d=>({ id:d.id, ...d.data() }));
    rygClaims = cs.docs.map(d=>({ id:d.id, ...d.data() }));
    rygParts.sort((a,b)=>{
      const ta = a.createdAt && a.createdAt.toDate ? a.createdAt.toDate().getTime() : 0;
      const tb = b.createdAt && b.createdAt.toDate ? b.createdAt.toDate().getTime() : 0;
      return tb - ta;
    });
    rygLastLoad = new Date();
    rygLoaded = true;
  }

  function rygDeParticipante(code){
    return rygClaims.filter(c => c.referralCode === code && !c.archived);
  }
  function rygCuenta(code){
    const cs = rygDeParticipante(code);
    return {
      total:      cs.length,
      entregados: cs.filter(c=>c.status==="gift_delivered"||c.status==="sale_confirmed").length,
      ventas:     cs.filter(c=>c.status==="sale_confirmed").length,
      validos:    cs.filter(c=>["valid","scheduled","gift_delivered","sale_confirmed"].includes(c.status)).length,
      citas:      cs.filter(c=>c.status==="scheduled").length
    };
  }
  function rygVencida(p){
    if(p.status !== "active") return true;
    const e = p.expiresAt && p.expiresAt.toDate ? p.expiresAt.toDate() : null;
    return e ? Date.now() > e.getTime() : false;
  }

  // ---------- Auditoría ----------
  async function rygAudit(action, targetId, reason, before, after){
    try{
      await addDoc(collection(db,"auditLogs"),{
        action: action,
        targetCollection: "giftClaims",
        targetId: targetId,
        reason: reason || "",
        adminEmail: (auth.currentUser && auth.currentUser.email) || "",
        before: before===undefined ? null : before,
        after:  after===undefined  ? null : after,
        at: serverTimestamp()
      });
    }catch(e){ console.error("auditoría", e); }
  }

  // ---------- Recalcular totales del participante ----------
  async function rygRecalcular(code){
    const p = rygParts.find(x=>x.id===code);
    if(!p) return;
    const n = rygCuenta(code);
    const nivel = rygNivel(n.entregados, n.ventas);
    const cs = rygDeParticipante(code).slice().sort((a,b)=>{
      const ta=a.claimedAt&&a.claimedAt.toDate?a.claimedAt.toDate().getTime():0;
      const tb=b.claimedAt&&b.claimedAt.toDate?b.claimedAt.toDate().getTime():0;
      return tb-ta;
    });
    const masked = cs.slice(0,40).map(c=>({ n: rygMask(c.recipientName), s: c.status }));
    let rewardStatus = p.rewardStatus || null;
    if(nivel > 0 && !["approved","delivered","substituted"].includes(rewardStatus)) rewardStatus = "pending_validation";
    if(nivel === 0) rewardStatus = null;

    const upd = {
      claimsTotal: n.total,
      giftsDelivered: n.entregados,
      salesConfirmed: n.ventas,
      currentLevel: nivel,
      rewardStatus: rewardStatus,
      maskedContacts: masked,
      updatedAt: serverTimestamp()
    };
    await updateDoc(doc(db,"giftParticipants",code), upd);
    Object.assign(p, upd, { currentLevel:nivel, rewardStatus:rewardStatus });

    if(nivel > 0){
      try{
        await setDoc(doc(db,"rewardRedemptions", code), {
          participantId: code,
          participantName: p.participantName || "",
          distributorId: p.distributorId || RYG_DIST.id,
          levelReached: nivel,
          prizeName: rygNombrePremio(nivel),
          status: rewardStatus,
          updatedAt: serverTimestamp()
        }, { merge:true });
      }catch(e){ console.error("recompensa", e); }
    }
  }

    if(nuevo==="contacted"      && !c.contactedAt)      upd.contactedAt = serverTimestamp();
    if(nuevo==="scheduled"      && !c.scheduledAt)      upd.scheduledAt = serverTimestamp();
    if(nuevo==="gift_delivered" && !c.deliveredAt)      upd.deliveredAt = serverTimestamp();
    if(nuevo==="sale_confirmed" && !c.saleConfirmedAt)  upd.saleConfirmedAt = serverTimestamp();

    try{
      await updateDoc(doc(db,"giftClaims",claimId), upd);
      Object.assign(c, upd, { status:nuevo });
      await rygAudit("cambio_estado", claimId, motivo||"", anterior, nuevo);
      await rygRecalcular(c.referralCode);
      toast("✓ " + (RYG_ST[nuevo] ? RYG_ST[nuevo].t : nuevo));
      rygPintar();
